<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CISSP Pocket Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f17;--panel:#131a26;--panel2:#1a2333;--line:#26324a;--txt:#e8edf6;--mut:#8b97ad;
  --acc:#ffb020;--acc2:#ff7a1a;--ok:#2fc57a;--bad:#f0605d;--blue:#5b9dff;
  --t1:#5fd3a2;--t2:#5b9dff;--t3:#c48bff;--t4:#ff6b8a;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
h1,h2,h3,.disp{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mut{color:var(--mut)}
.sm{font-size:13px}.xs{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;font-weight:600;font-size:16px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1000;box-shadow:0 8px 24px -10px var(--acc2)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.small{padding:10px 12px;font-size:14px;width:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stat{display:flex;align-items:center;gap:6px;font-weight:700;font-family:"Space Grotesk"}
.flame{font-size:20px}
.flame.dead{filter:grayscale(1);opacity:.5}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
/* hero */
.hero{position:relative;overflow:hidden}
.hero h2{font-size:22px;margin-bottom:4px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--panel2)}
.ring .fg{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ringlbl{position:absolute;inset:0;display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;font-size:18px}
.risk{margin-top:10px;padding:8px 12px;border-radius:10px;background:#3a1d0a;color:#ffc58a;font-size:13px}
/* grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;position:relative}
.tile b{display:block;font-family:"Space Grotesk";font-size:15px;margin-top:4px}
.tile .em{font-size:22px}
.tile .badge{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.tile.locked{opacity:.45}
.sect{margin:22px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
/* tiers */
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tierb{padding:10px 2px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600;text-align:center}
.tierb .e{display:block;font-size:18px}
.tierb.on{border-color:var(--acc);background:#2a2110}
/* xp */
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .6s}
.dom{display:grid;grid-template-columns:28px 1fr 42px;gap:8px;align-items:center;padding:7px 0;width:100%;text-align:left}
.dom .n{font-family:"Space Grotesk";font-weight:700;color:var(--mut)}
.dom .nm{font-size:13px;margin-bottom:4px}
.dom .pc{text-align:right;font-weight:600;font-size:13px}
/* quiz */
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dots{display:flex;gap:5px;flex:1}
.dots i{flex:1;height:5px;border-radius:9px;background:var(--panel2)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.cur{background:var(--acc)}
.stem{font-size:18px;line-height:1.45;font-weight:500;margin:10px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);margin-bottom:10px;font-size:15px;transition:border-color .15s,background .15s}
.opt .L{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);font-weight:700;font-size:13px;font-family:"Space Grotesk"}
.opt.sel{border-color:var(--acc);background:#211a0c}
.opt.right{border-color:var(--ok);background:#0d2a1c}
.opt.right .L{background:var(--ok);color:#03140b}
.opt.wrong{border-color:var(--bad);background:#2c1112}
.opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.conf{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 25%)}
.conf .row{gap:8px}
.conf .btn{padding:14px 6px;font-size:14px}
.fb{border-radius:14px;padding:14px;margin:6px 0 12px;border:1px solid var(--line);background:var(--panel)}
.fb h3{font-size:17px;margin-bottom:6px}
.fb.ok{border-color:#1f6b45}.fb.bad{border-color:#7a2a2a}
.xpfly{font-family:"Space Grotesk";font-weight:700;color:var(--acc)}
.crit{color:#ffe14d}
/* toast */
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--panel2);border:1px solid var(--acc);padding:10px 16px;border-radius:14px;font-weight:600;z-index:50;transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
/* sheet */
.sheetbg{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;width:100%;max-width:520px;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border:1px solid var(--line)}
.field{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600}
.seg button.on{background:var(--acc);color:#1a1000}
input[type=date]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;color-scheme:dark}
/* onboarding */
.ob{padding-top:30px}
.ob h1{font-size:30px;line-height:1.15;margin-bottom:10px}
.lvl{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);margin-bottom:10px}
.lvl .e{font-size:28px}
.lvl b{font-family:"Space Grotesk";font-size:16px;display:block}
.big{font-size:44px;font-family:"Space Grotesk";font-weight:700;line-height:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 24px -10px var(--acc2)}50%{box-shadow:0 8px 34px -4px var(--acc2)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.sync{font-size:11px;color:var(--mut)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ffb020"/><stop offset="1" stop-color="#ff7a1a"/></linearGradient></defs></svg>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<canvas class="confetti" id="cf"></canvas>

<script>
// [domain, tier(1 Recruit,2 Analyst,3 Manager,4 CISO), stem, [CORRECT, wrong, wrong, wrong], rationale]
const QB = [
// ── D1 Security & Risk Management ──
[1,1,"Buying cyber-insurance is which risk response?",["Transference","Mitigation","Avoidance","Acceptance"],"Insurance shifts the financial impact to a third party. Mitigation would reduce likelihood or impact; avoidance stops the activity."],
[1,1,"Annualized Loss Expectancy (ALE) is calculated as:",["SLE × ARO","AV × EF","SLE ÷ ARO","ARO × EF"],"ALE = Single Loss Expectancy × Annualized Rate of Occurrence. AV × EF gives you the SLE, not the ALE."],
[1,1,"Which security principle prevents information from being disclosed to unauthorized parties?",["Confidentiality","Integrity","Availability","Non-repudiation"],"Confidentiality = no unauthorized disclosure. Integrity = no unauthorized change. Availability = accessible when needed."],
[1,1,"Who is ultimately accountable for protecting an organization’s assets?",["Senior management","The CISO","The data custodian","The security administrator"],"Accountability can’t be delegated: senior management owns it. The CISO and the custodians carry out the work but aren’t ultimately accountable."],
[1,1,"Due care is BEST described as:",["Taking reasonable actions to protect assets — doing the right thing","Researching and understanding risks before acting","Transferring risk to a third party","Documenting controls for auditors"],"Due care = doing (acting as a prudent person would). Due diligence = knowing/investigating. Mnemonic: Diligence → Discover, Care → Conduct."],
[1,2,"Asset value $200,000, exposure factor 25%, ARO 0.5. What is the ALE?",["$25,000","$50,000","$100,000","$12,500"],"SLE = 200,000 × 0.25 = $50,000. ALE = 50,000 × 0.5 = $25,000. $50,000 is the SLE, which is a common trap."],
[1,2,"A document mandating AES-256 full-disk encryption on all laptops is a:",["Standard","Policy","Guideline","Procedure"],"Standards are mandatory and name specific technologies. Policies are high-level intent, guidelines are optional advice, and procedures are step-by-step instructions."],
[1,2,"Which BCP activity identifies critical functions and their Maximum Tolerable Downtime?",["Business Impact Analysis","Risk assessment","Disaster recovery plan","Tabletop exercise"],"The BIA determines criticality, MTD, RTO and RPO. The DRP comes later and restores IT to meet those targets."],
[1,2,"Under GDPR, the entity that decides the purposes and means of processing personal data is the:",["Controller","Processor","Data subject","Data Protection Officer"],"The controller decides why and how. The processor acts on the controller’s behalf. The DPO advises and oversees compliance."],
[1,2,"In STRIDE, an attacker changing a transaction amount in transit is:",["Tampering","Spoofing","Repudiation","Elevation of privilege"],"Tampering means unauthorized modification, which is an integrity threat. Spoofing is impersonating an identity."],
[1,2,"Which control’s main weakness is collusion?",["Separation of duties","Least privilege","Mandatory vacation","Dual-factor authentication"],"Separation of duties splits a task across people, so it fails if those people conspire. Job rotation and mandatory vacations help detect collusion."],
[1,3,"A new privacy regulation may apply to your company. What should the security manager do FIRST?",["Work with legal counsel to determine applicability and requirements","Implement encryption on all databases","Buy a compliance management tool","Notify all employees of the new law"],"Understand before acting. Legal interprets whether the regulation applies and what it requires. Controls come after you know the requirement."],
[1,3,"A control costs more per year than the ALE it reduces. What is the BEST action?",["Accept the risk, with documented management sign-off","Implement the control anyway for defense in depth","Stop the business activity","Buy insurance regardless of cost"],"A control should cost less than the loss it prevents. When it doesn’t, management formally accepts the risk. Security doesn’t make that call alone."],
[1,3,"Security awareness training is MOST effective when it is:",["Role-based and reinforced regularly","A single annual compliance video","Delivered only to IT staff","Given only after an incident"],"Behavior changes through relevant, repeated content. One-off training decays fast, and everyone is a target, not just IT."],
[1,3,"Who should decide the acceptable level of residual risk?",["Senior management / the asset owner","The security team","Internal audit","IT operations"],"Risk acceptance is a business decision. Security advises, audit verifies, and management decides."],
[1,3,"Your company plans to move payroll to a SaaS provider. What should happen FIRST?",["Due diligence on the provider’s security posture","Sign the SLA","Migrate a test data set","Encrypt the payroll database"],"Assess the vendor before you commit. Contract terms and migration only come after the risk is understood."],
[1,4,"Management orders you to stay quiet about a product flaw that endangers public safety. Which ISC2 canon takes precedence?",["Protect society, the common good, and public trust","Act honorably, honestly, justly, responsibly, legally","Provide diligent and competent service to principals","Advance and protect the profession"],"The canons are applied in order, and protecting society comes first. Duty to your employer (principals) is third."],
[1,4,"The board wants a fast risk prioritization of 200 assets with little historical loss data. MOST appropriate method?",["Qualitative analysis (likelihood/impact ratings)","Quantitative ALE for every asset","Monte Carlo simulation","Delphi technique for each asset individually"],"Qualitative analysis is quick and works without hard data. A quantitative ALE needs reliable values and frequencies you don’t have."],
[1,4,"MTD is 24 h and work recovery time (WRT) is 6 h. What is the maximum acceptable RTO?",["18 hours","24 hours","30 hours","6 hours"],"MTD = RTO + WRT, so RTO ≤ 24 − 6 = 18 h. Setting RTO equal to MTD leaves no time to verify and resume work."],
[1,4,"An administrator is being terminated for cause. What is the MOST important security step?",["Disable their logical access at the time of notification","Conduct a thorough exit interview","Collect the badge and laptop afterwards","Remind them of their NDA"],"Remove access at the same moment they’re notified, or before, so a disgruntled admin can’t act. The other steps matter less."],
// ── D2 Asset Security ──
[2,1,"Who assigns the classification level to a data set?",["Data owner","Data custodian","Data user","Auditor"],"The owner, usually a business leader, classifies and decides protection. The custodian carries out those decisions."],
[2,1,"Who performs backups and maintains data day to day, as directed by the owner?",["Data custodian","Data owner","Data subject","Data controller"],"Custodians, often IT, handle the hands-on protection that the owner specifies."],
[2,1,"Degaussing is effective for sanitizing:",["Magnetic hard drives and tapes","Solid-state drives","Optical discs","Paper records"],"Degaussing disrupts magnetic fields. It does nothing to flash or optical media."],
[2,1,"Data remanence refers to:",["Residual data that remains after deletion attempts","Data kept under a retention schedule","Backup copies stored offsite","Metadata attached to files"],"Remanence is leftover data that might be recovered after you thought it was gone, which is why proper sanitization exists."],
[2,1,"The PRIMARY purpose of data classification is to:",["Apply protection proportional to value and sensitivity","Satisfy auditors","Reduce storage costs","Speed up backups"],"Classification lets you spend protection where it matters most instead of protecting everything equally."],
[2,2,"What is the MOST reliable way to sanitize SSDs leaving the organization?",["Physical destruction (shred/disintegrate)","Degaussing","Single-pass overwrite","Quick format"],"Wear-leveling hides blocks from overwrites, and degaussing doesn’t affect flash. Destruction, or a verified crypto-erase, is reliable."],
[2,2,"Replacing customer names with tokens that can be re-linked using a separately stored key is:",["Pseudonymization","Anonymization","Data masking for display","Unsalted hashing"],"If re-identification is possible with additional information, the data is pseudonymized. Anonymized data can’t be linked back, and GDPR treats it differently."],
[2,2,"Removing baseline controls that don’t apply to a system is called:",["Scoping","Tailoring","Compensating","Hardening"],"Scoping decides which controls apply. Tailoring then adjusts the remaining controls to fit the mission."],
[2,2,"Data Loss Prevention (DLP) PRIMARILY protects against:",["Unauthorized data exfiltration","Malware execution","Denial of service","Privilege escalation"],"DLP inspects data in motion, at rest and in use to stop sensitive data leaving through unapproved channels."],
[2,2,"Best protection for data at rest on employee laptops?",["Full-disk encryption","TLS 1.3","Hashing","Network DLP"],"FDE protects stored data if the laptop is lost or stolen. TLS protects data in transit, and hashing is for integrity."],
[2,3,"What is the FIRST step in building an asset security program?",["Identify and inventory assets","Classify the data","Encrypt sensitive data","Deploy DLP"],"You can’t classify or protect what you don’t know you have. Inventory comes first."],
[2,3,"Keeping data beyond its retention period PRIMARILY increases:",["Legal liability and e-discovery exposure","Storage costs only","Availability risk","Integrity risk"],"Anything you keep can be subpoenaed or breached. Retention limits reduce both legal and breach exposure."],
[2,3,"Developers want production customer data for testing. BEST approach?",["Use masked or synthetic data","Copy production under an NDA","Test directly in production","Encrypt the test database and copy production"],"Test environments are weaker, so keep real personal data out of them. Encryption doesn’t help when testers can read the data."],
[2,3,"Classification labels are applied inconsistently across departments. Manager’s BEST action?",["Define clear classification criteria in policy and train data owners","Have IT classify all data centrally","Classify everything at the highest level","Buy an auto-classification tool"],"Inconsistency usually means the governance is unclear. Fix the policy and train the people before buying tools."],
[2,3,"A covered entity (HIPAA) shares PHI with a billing company. Which agreement is required?",["Business Associate Agreement","Interconnection Security Agreement","Memorandum of Understanding","Service Level Agreement"],"HIPAA requires a BAA with any business associate that handles PHI for the covered entity."],
[2,4,"You’re exiting a SaaS contract and can’t physically destroy the provider’s disks. BEST way to make your data unrecoverable?",["Crypto-shredding — destroy the encryption keys","Ask the provider to delete the files","Overwrite the records with zeros via the API","Degauss via the provider"],"In the cloud you can’t reach the media. If you hold the keys, destroying them makes the ciphertext useless."],
[2,4,"Which protection addresses data IN USE?",["Trusted execution environment / secure enclave","TLS 1.3","Full-disk encryption","Tokenization at rest"],"Data in use lives in memory and CPU, and confidential computing protects it there. TLS covers data in motion, and FDE covers data at rest."],
[2,4,"Which role ensures the SYSTEM processing a data set has adequate controls?",["System owner","Data owner","Data custodian","Data processor"],"The data owner classifies the data, but the system owner is responsible for the system’s security plan and controls."],
[2,4,"Under NIST SP 800-88, overwriting user-addressable storage to defeat simple, non-invasive recovery is:",["Clear","Purge","Destroy","Declassify"],"Clear stops basic tool recovery. Purge stops lab-level recovery. Destroy means physical destruction."],
[2,4,"Customer records will be stored in a cloud region in another country. Which concept MOST directly governs whether that is allowed?",["Data sovereignty / residency requirements","Data remanence","Data minimization","Data lineage"],"Sovereignty means the data is subject to the laws of the country where it’s stored, and residency rules may forbid moving it. Minimization limits how much you collect, not where it’s stored."],
// ── D3 Security Architecture & Engineering ──
[3,1,"Bell-LaPadula is PRIMARILY concerned with:",["Confidentiality","Integrity","Availability","Accountability"],"BLP is a military model built for confidentiality: no read up, no write down."],
[3,1,"Biba is PRIMARILY concerned with:",["Integrity","Confidentiality","Availability","Conflict of interest"],"Biba protects integrity with no read down and no write up, the reverse of BLP."],
[3,1,"Which is a symmetric algorithm?",["AES","RSA","ECC","Diffie-Hellman"],"AES uses one shared key. RSA and ECC are asymmetric, and DH is a key-exchange method."],
[3,1,"Which provides non-repudiation?",["Digital signature","Symmetric encryption","HMAC","Plain hashing"],"Only the private-key holder can sign. HMAC uses a shared key, so either party could have produced it."],
[3,1,"Hashing PRIMARILY provides:",["Integrity","Confidentiality","Availability","Authentication of origin"],"A hash detects changes. It hides nothing and doesn’t prove who sent the data."],
[3,2,"How many symmetric keys are needed for 10 users to communicate privately in pairs?",["45","20","90","100"],"n(n−1)/2 = 10×9/2 = 45. With asymmetric crypto you would need only 2n = 20 keys."],
[3,2,"Bell-LaPadula’s *-property (star property) states:",["No write down","No read up","No read down","No write up"],"The simple security property is no read up, and the * property is no write down. ‘The star doesn’t fall’ is a handy memory hook."],
[3,2,"In the US classification, an electrical fire is Class:",["C","A","B","K"],"A = common combustibles, B = liquids, C = electrical, D = metals, K = kitchen. Don’t use water on Class C."],
[3,2,"TOCTOU is a type of:",["Race condition","Buffer overflow","Covert channel","Side-channel attack"],"Time-of-check to time-of-use: the state changes between the check and the use of the resource."],
[3,2,"Which cloud model gives the customer the MOST control over the operating system?",["IaaS","PaaS","SaaS","FaaS"],"With IaaS you manage the OS and above. With PaaS and SaaS, the provider manages progressively more."],
[3,2,"Which block cipher mode leaks patterns because identical plaintext blocks give identical ciphertext?",["ECB","CBC","GCM","CTR"],"ECB has no IV or chaining, which is the famous ‘ECB penguin’ problem. Never use it for real data."],
[3,3,"When should security be built into a new system?",["From requirements and design onward","During testing","Just before go-live","After the first audit"],"Fixing a design flaw late costs far more. Secure by design starts at requirements."],
[3,3,"Clark-Wilson enforces integrity through:",["Well-formed transactions and separation of duties","Security labels and clearances","Conflict-of-interest classes","No read down, no write up"],"Users reach data only through approved programs (the access triple: subject, program, object)."],
[3,3,"The strength of a cryptographic system depends MOST on:",["The secrecy and management of the keys","Keeping the algorithm secret","The vendor’s reputation","The ciphertext length"],"Kerckhoffs’s principle: assume the algorithm is public. Security rests on the key, so key management is everything."],
[3,3,"Factory IoT sensors can’t be patched. BEST action?",["Isolate them on a segmented network with strict controls","Replace them immediately at any cost","Accept the risk without documentation","Install antivirus on them"],"Compensating controls such as isolation and monitoring reduce the risk when patching isn’t possible."],
[3,3,"The core principle of zero trust architecture is:",["Never trust, always verify — authorize every request regardless of location","Trust internal traffic and inspect external traffic","Use a stronger perimeter firewall","Encrypt all data at rest"],"Network location grants no trust. Each request is authenticated and authorized based on identity, device and context."],
[3,4,"A consultancy must stop an analyst who has viewed Bank A’s data from accessing Bank B’s. Which model?",["Brewer-Nash (Chinese Wall)","Biba","Bell-LaPadula","Graham-Denning"],"Brewer-Nash changes access dynamically based on what you’ve already accessed, to prevent conflicts of interest."],
[3,4,"Which mode provides authenticated encryption (confidentiality + integrity)?",["GCM","CBC","CTR","ECB"],"GCM combines CTR-mode encryption with GMAC authentication. CBC and CTR alone don’t give integrity."],
[3,4,"Perfect forward secrecy is achieved by:",["Ephemeral Diffie-Hellman key exchange (DHE/ECDHE)","Longer RSA keys","Static key exchange","Hashing session keys"],"Each session uses a fresh key, so stealing the long-term private key later doesn’t decrypt past sessions."],
[3,4,"In Common Criteria, the vendor’s document stating the security claims for its product is the:",["Security Target","Protection Profile","Evaluation Assurance Level","Target of Evaluation"],"The Protection Profile states the requirements a consumer needs. The Security Target is what the vendor claims. The TOE is the product evaluated."],
// ── D4 Communication & Network Security ──
[4,1,"At which OSI layer do routers operate?",["Layer 3 – Network","Layer 2 – Data Link","Layer 4 – Transport","Layer 7 – Application"],"Routers forward packets by IP address at Layer 3. Switches work at Layer 2 using MAC addresses."],
[4,1,"The default port for HTTPS is:",["443","80","22","3389"],"Port 80 is HTTP, 22 is SSH and 3389 is RDP."],
[4,1,"Which protocol resolves an IP address to a MAC address?",["ARP","DNS","DHCP","RARP"],"ARP maps IP to MAC. DNS maps names to IPs. RARP is the legacy reverse (MAC to IP)."],
[4,1,"A firewall that tracks connection state to allow return traffic is:",["Stateful inspection","Static packet filter","Circuit-level proxy","Application proxy"],"Stateful firewalls keep a state table. Static filters check each packet on its own."],
[4,1,"Which device creates a separate collision domain per port at Layer 2?",["Switch","Hub","Repeater","Router"],"Each switch port is its own collision domain. A hub puts every port in one collision domain."],
[4,2,"WPA3-Personal replaces the WPA2 pre-shared key handshake with:",["SAE (Simultaneous Authentication of Equals)","TKIP","EAP-TLS","WEP"],"SAE (Dragonfly) resists offline dictionary attacks against the passphrase."],
[4,2,"A SYN flood exploits:",["The TCP three-way handshake","UDP’s lack of connection state","ICMP echo replies","DNS recursion"],"Half-open connections fill the server’s backlog. SYN cookies are a classic mitigation."],
[4,2,"Which IPsec mode encrypts the ENTIRE original IP packet?",["Tunnel mode","Transport mode","AH mode","IKE mode"],"Tunnel mode wraps the whole packet in a new header, which is typical for site-to-site VPNs. Transport mode protects only the payload."],
[4,2,"DNSSEC provides:",["Origin authentication and integrity of DNS data","Confidentiality of DNS queries","Protection against DDoS","Encrypted zone transfers"],"DNSSEC signs records but doesn’t encrypt them. DoH and DoT provide confidentiality."],

[4,3,"After a breach you want to segment a flat network. What do you do FIRST?",["Identify assets and data flows to define zones","Buy next-gen firewalls","Create VLANs for every department","Block all east-west traffic"],"Understand the traffic before you cut it. Otherwise segmentation breaks the business."],
[4,3,"BEST defense against ARP spoofing on a switched LAN?",["Dynamic ARP Inspection","Port mirroring","Static routes","Disabling ICMP"],"DAI checks ARP packets against the DHCP snooping bindings."],
[4,3,"BEST way to protect the corporate network from guest Wi-Fi users?",["A separate isolated guest network with firewall rules","A different WPA2 passphrase on the same VLAN","Hiding the SSID","MAC filtering"],"Isolation is a real control. Hiding the SSID and MAC filtering are easily bypassed."],
[4,3,"Management wants automatic attack blocking but fears outages from false positives. BEST approach?",["Deploy IPS in detect-only mode, tune it, then enable blocking","Deploy IPS in blocking mode immediately","Use an IDS only, permanently","Rely on the firewall alone"],"Tune first to reduce false positives, then enforce. That balances protection and availability."],
[4,3,"The PRIMARY risk of VPN split tunneling is:",["A compromised client can bridge the internet and the corporate network","Slower VPN performance","Higher licensing cost","Weaker encryption"],"Internet traffic bypasses corporate inspection while the same machine is connected internally."],
[4,4,"BEST mitigation for VLAN hopping via double tagging?",["Set the native VLAN to an unused VLAN and don’t use it for user ports","Enable port security","Use 802.1X on trunk ports","Enable spanning tree"],"Double tagging abuses the native VLAN. Changing it to an unused VLAN, or tagging the native VLAN, defeats the attack."],
[4,4,"Which IPsec configuration hides the original source and destination IPs from eavesdroppers?",["ESP in tunnel mode","AH in transport mode","AH in tunnel mode","ESP in transport mode"],"Only tunnel mode encapsulates the original header, and only ESP encrypts it. AH authenticates but never encrypts."],
[4,4,"In software-defined networking, centralized forwarding decisions are made in the:",["Control plane","Data plane","Management plane","Application plane"],"The SDN controller, in the control plane, programs the switches, which only forward traffic in the data plane."],

// ── D5 Identity & Access Management ──
[5,1,"A smart card is which authentication factor?",["Something you have","Something you know","Something you are","Somewhere you are"],"A possession factor. A PIN is something you know, and a fingerprint is something you are."],

[5,3,"Employees keep old access after changing roles. BEST control?",["Periodic access reviews and recertification","Stronger passwords","More MFA prompts","Annual security training"],"Privilege creep is caught by reviewing access regularly against current job needs."],

[5,3,"The biggest risk SSO introduces, and the BEST mitigation?",["One compromised credential opens many systems — enforce MFA","Slower logins — add caching","More passwords to remember — use a password manager","Vendor lock-in — use open standards"],"SSO concentrates the risk in one credential, and MFA hardens that key."],
[5,3,"Several admins share service account passwords that never change. BEST fix?",["Vault the credentials in a PAM solution with rotation and checkout","Email the password to admins monthly","Write the password policy in the wiki","Disable the service accounts"],"PAM gives individual accountability, automatic rotation and session logging."],

[5,4,"The KEY advantage of ABAC over RBAC is:",["Fine-grained, context-aware decisions (time, location, device)","Simpler administration","No need for identity management","Better performance"],"ABAC evaluates attributes in a policy at request time, which suits zero trust."],

[6,4,"When prioritizing remediation from scan results, what matters MOST?",["Asset criticality and exploitability in your environment","The CVSS base score alone","The order findings appear in","Which team owns the system"],"Risk is contextual. A CVSS 9 on an isolated test box may matter less than a 7 on an internet-facing payment server."],

[7,1,"The FIRST phase of the NIST incident response lifecycle is:",["Preparation","Detection & analysis","Containment","Recovery"],"Preparation, then detection and analysis, then containment, eradication and recovery, then post-incident activity."],
[7,1,"The purpose of chain of custody is to:",["Preserve evidence integrity and admissibility","Speed up investigations","Encrypt evidence","Notify law enforcement"],"It documents who handled the evidence, when and why. Gaps make evidence inadmissible."],

[7,2,"Full backup on Sunday, incrementals every night. The server dies Thursday morning. What do you restore?",["Sunday full + Mon, Tue, Wed incrementals","Sunday full + Wednesday incremental only","Wednesday incremental only","Sunday full only"],"Each incremental holds only one day’s changes, so you need all of them in order."],

[7,3,"A critical patch is released for a production system. BEST approach?",["Test in staging, then deploy promptly via change management","Deploy immediately to production","Wait for the next quarterly cycle","Let users install it"],"Balance urgency with stability: test, approve, deploy fast."],
[7,4,"Which DR test activates the alternate site while the primary keeps running?",["Parallel test","Tabletop","Checklist review","Full interruption"],"A parallel test proves the recovery site works without risking production. Full interruption shuts the primary down."],
[7,4,"The best evidence rule concerns:",["Preferring original documents over copies","Collecting the most evidence possible","Using the most recent evidence","Expert witness testimony"],"Courts prefer originals. Copies need justification."],
[7,4,"A honeypot that lures attackers ALREADY intent on intruding is:",["Enticement — generally legal","Entrapment — illegal","Pretexting","Baiting fraud"],"Enticement offers an opportunity to someone already intending to attack. Entrapment induces a crime the person didn’t intend."],
[7,4,"The PRIMARY benefit of SOAR is:",["Automating and orchestrating response playbooks","Replacing the SIEM","Eliminating analysts","Providing threat feeds"],"SOAR speeds up and standardizes response, and it works alongside the SIEM."],

[8,1,"BEST defense against SQL injection?",["Parameterized queries / prepared statements","Client-side validation","Hiding error messages","Using a NoSQL database"],"Parameters separate code from data. Client-side checks can be bypassed."],
[8,1,"Cross-site scripting (XSS) involves:",["Injecting malicious scripts into pages viewed by other users","Forging requests from an authenticated user","Overflowing a memory buffer","Injecting SQL commands"],"XSS runs in the victim’s browser. Output encoding and a CSP help defend against it."],
[8,1,"In which SDLC phase should security requirements be defined?",["Requirements / initiation","Testing","Deployment","Maintenance"],"Requirements drive design. Adding them late is expensive."],
[8,1,"A defining characteristic of Agile development is:",["Iterative delivery in short sprints","A strict sequential phase order","No testing until the end","Requirements frozen at the start"],"Waterfall is sequential. Agile iterates and adapts."],
[8,1,"Buffer overflows are BEST prevented by:",["Bounds checking and input validation","Encrypting memory","Longer passwords","Firewalls"],"Never write past the allocated space. Memory-safe languages help."],
[8,2,"CSRF exploits:",["The trust a site places in an authenticated user’s browser","The trust a user places in a website","Unsanitized SQL input","Weak encryption"],"The browser sends cookies automatically. Anti-CSRF tokens and SameSite cookies defend against it."],
[8,2,"Which practice finds known vulnerabilities in open-source dependencies?",["Software Composition Analysis (SCA)","SAST","DAST","Fuzzing"],"SCA checks the libraries you include against vulnerability databases."],

[8,2,"What assures customers that downloaded software hasn’t been altered and comes from the vendor?",["Code signing","Obfuscation","Compression","Checksums posted on the same server"],"Signatures prove both origin and integrity. A checksum on a compromised server proves nothing."],
[8,3,"BEST action before acquiring third-party software?",["Assess the vendor’s secure development practices and set contractual security requirements","Rely on marketing claims","Buy the cheapest option","Install it and scan later"],"Supply-chain risk is managed before you sign the contract."],
[8,3,"Developers push code straight to production. BEST control?",["Separation of duties with change management and pipeline approval gates","Ask developers to be careful","Annual code audits","Restrict internet access"],"No one should write and deploy code unchecked. Gates enforce review."],
[8,3,"Where is fixing a security defect CHEAPEST?",["Requirements and design","Testing","Production","Maintenance"],"The cost of a fix rises sharply in each later phase."],
[8,3,"An API key is found committed to a public repo. FIRST action?",["Revoke and rotate the key","Delete the commit","Make the repo private","Add the file to .gitignore"],"Assume the key is already harvested. Deleting the commit doesn’t remove it from forks or caches."],

[8,4,"Which control BEST prevents mass-assignment vulnerabilities in APIs?",["Explicitly allow-list the fields that can be bound from requests","Rate limiting","TLS encryption","Longer session timeouts"],"Mass assignment happens when attackers set fields like isAdmin=true. Bind only approved fields."]

<script>
(function(){
"use strict";
const DOMS={1:["Security & Risk Mgmt",16],2:["Asset Security",10],3:["Architecture & Engineering",13],4:["Network Security",13],5:["Identity & Access",13],6:["Assessment & Testing",12],7:["Security Operations",13],8:["Software Dev Security",10]};
const TIERS={1:["Recruit","🌱","Recall the concept"],2:["Analyst","🔎","Apply it"],3:["Manager","🧭","BEST / FIRST / MOST"],4:["CISO","👑","Tricky, exam-hard"]};
const RANKS=[[0,"Recruit"],[300,"Analyst"],[800,"Engineer"],[1600,"Architect"],[3000,"Manager"],[5000,"Director"],[8000,"CISO"],[12000,"Exam-Ready"]];
const TIPS=["Think like a manager: people first, then process, then technology.","On ‘FIRST’ questions, pick the step that understands the problem before the one that fixes it.","Senior management owns risk. Security advises, and doesn’t decide.","If an answer is purely technical and another addresses policy or governance, look twice at the governance one.","Life safety beats everything, including evidence, uptime and money.","‘BEST’ means the most complete answer, not the one that’s merely true.","A control should never cost more than what it protects.","Watch for absolutes like ‘always’ and ‘immediately’. They’re usually traps.","Contain before you eradicate, and collect evidence before you wipe.","Owners decide, custodians implement, users comply."];
const Q=QB.map((r,i)=>({id:"q"+i,d:r[0],t:r[1],s:r[2],o:r[3],w:r[4]}));
const byId={};Q.forEach(q=>byId[q.id]=q);

/* ---------- state ---------- */
const KEY="cissp-pocket-v1";
const blank=()=>({v:1,updated:0,xp:0,tier:1,th:[],streak:0,best:0,lastGoal:-9,freezes:0,goal:5,days:{},dom:{},seen:{},boss:-1,exam:"",onboard:false,conf:true,ai:{},answered:0,bestCombo:0});
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
const today=()=>{const d=new Date();return Math.floor((d-d.getTimezoneOffset()*60000)/864e5)};
let dbRef=null,saveT=null,syncState="";
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(dbRef){clearTimeout(saveT);saveT=setTimeout(async()=>{try{await dbRef.set({json:JSON.stringify(S),updated:S.updated});syncState="☁︎ Synced";}catch(e){syncState="";}const el=document.getElementById("sync");if(el)el.textContent=syncState;},800)}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function toast(msg,ms=2200){const t=$("#toast");t.innerHTML=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),ms)}
function rankOf(xp){let r=RANKS[0],n=null;for(let i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0]){r=RANKS[i];n=RANKS[i+1]||null}}return{name:r[1],from:r[0],next:n}}
function liveStreak(){const t=today();if(S.lastGoal>=t-1)return S.streak;if(S.lastGoal===t-2&&S.freezes>0)return S.streak;return 0}
function todayCount(){return S.days[today()]||0}
function domAcc(d){const x=S.dom[d];return x&&x.a?x.c/x.a:null}
function readiness(){let s=0;for(const d in DOMS){const x=S.dom[d];if(!x||!x.a)continue;const acc=x.c/x.a,cov=Math.min(1,x.a/15);s+=DOMS[d][1]*acc*cov}return Math.round(s)}
function dueIds(){const t=today();return Object.keys(S.seen).filter(id=>S.seen[id].due<=t&&(byId[id]||S.ai[id])).sort((a,b)=>S.seen[a].due-S.seen[b].due)}
function getQ(id){return byId[id]||S.ai[id]}
function weakest(){let best=null,v=2;for(const d in DOMS){const a=domAcc(d);const score=a===null?0.55:a;if(score<v){v=score;best=+d}}return best||1}

/* ---------- pick questions ---------- */
function pickFrom(pool,n,exclude){
  const ex=new Set(exclude||[]);pool=pool.filter(q=>!ex.has(q.id));
  const unseen=shuffle(pool.filter(q=>!S.seen[q.id]));
  const seen=pool.filter(q=>S.seen[q.id]).sort((a,b)=>(S.seen[a.id].last||0)-(S.seen[b.id].last||0));
  // weight unseen toward weak domains
  unseen.sort((a,b)=>((domAcc(a.d)??.55)-(domAcc(b.d)??.55))+(Math.random()-.5)*.6);
  const all=unseen.concat(seen),out=[],per={};
  for(const q of all){if(out.length>=n)break;if((per[q.d]||0)<2){out.push(q);per[q.d]=(per[q.d]||0)+1}}
  for(const q of all){if(out.length>=n)break;if(!out.includes(q))out.push(q)}
  return out;
}
function buildSet(mode,arg){
  const n=mode==="one"?1:(mode==="boss"?1:5);
  if(mode==="boss"){const t4=Q.filter(q=>q.t===4);return [t4[today()%t4.length]]}
  if(mode==="review"){return dueIds().slice(0,10).map(getQ)}
  if(mode==="domain"){const pool=Q.filter(q=>q.d===arg);const out=[];[1,2,3,4].forEach(t=>out.push(...pickFrom(pool.filter(q=>q.t===t),2)));return shuffle(out).sort((a,b)=>a.t-b.t).slice(0,6)}
  const tier=mode==="tier"?arg:S.tier;
  const out=[];
  if(mode!=="tier"&&mode!=="one"){out.push(...dueIds().slice(0,2).map(getQ))}
  const ids=out.map(q=>q.id);
  const stretch=(mode==="auto"&&tier<4&&n>1)?1:0;
  out.push(...pickFrom(Q.filter(q=>q.t===tier),n-out.length-stretch,ids));
  if(stretch)out.push(...pickFrom(Q.filter(q=>q.t===tier+1),1,out.map(q=>q.id)));
  if(out.length<n)out.push(...pickFrom(Q,n-out.length,out.map(q=>q.id)));
  return out.slice(0,n);
}

/* ---------- session ---------- */
let R=null; // running session
function start(mode,arg){
  const set=buildSet(mode,arg);
  if(!set.length){toast(mode==="review"?"🎉 Nothing to review — you’re clean!":"No questions here yet");return}
  R={mode,arg,set,i:0,res:[],xp:0,combo:0,maxCombo:0,stage:"q",sel:null,order:null,startTier:S.tier,goalHitBefore:todayCount()>=S.goal};
  prepQ();render();window.scrollTo(0,0);
}
function prepQ(){const q=R.set[R.i];R.order=shuffle([0,1,2,3]);R.sel=null;R.stage="q";R.q=q}
function answer(conf){
  const q=R.q,ok=R.sel===0,t=today();
  // xp
  let xp=0,crit=false,base=10*q.t*(R.mode==="boss"?3:1);
  if(ok){R.combo++;R.maxCombo=Math.max(R.maxCombo,R.combo);
    xp=Math.round(base*(conf==="sure"?1.5:conf==="guess"?0.6:1))+Math.min(R.combo-1,5)*2;
    if(Math.random()<.12){xp*=2;crit=true}}
  else{R.combo=0;xp=2}
  S.xp+=xp;R.xp+=xp;
  // stats
  const dm=S.dom[q.d]||(S.dom[q.d]={a:0,c:0});dm.a++;if(ok)dm.c++;
  S.days[t]=(S.days[t]||0)+1;S.answered++;
  // leitner
  const sv=S.seen[q.id]||{b:0,c:0,w:0};const gaps=[1,2,4,7,14,30];
  if(ok&&conf!=="guess"){sv.b=Math.min(sv.b+1,5);sv.due=t+gaps[sv.b];sv.c++}
  else if(ok){sv.due=t+1;sv.c++}
  else{sv.b=0;sv.due=t;sv.w++}
  sv.last=Date.now();S.seen[q.id]=sv;
  if(q.ai&&ok&&conf!=="guess"&&sv.b>=2){/* graduate ai q from storage */}
  // auto tier ladder
  let tierMsg="";
  if(q.t===S.tier&&(R.mode==="auto"||R.mode==="one")){
    S.th.push(ok?1:0);S.th=S.th.slice(-5);const c=S.th.reduce((a,b)=>a+b,0);
    if(S.th.length>=5&&c>=4&&S.tier<4){S.tier++;S.th=[];tierMsg="up"}
    else if(S.th.length>=4&&S.th.slice(-4).reduce((a,b)=>a+b,0)<=1&&S.tier>1){S.tier--;S.th=[];tierMsg="down"}
  }
  // streak
  let streakMsg="";
  if(S.days[t]>=S.goal&&S.lastGoal!==t){
    if(S.lastGoal===t-1)S.streak++;
    else if(S.lastGoal===t-2&&S.freezes>0){S.freezes--;S.streak++;streakMsg="🧊 Streak freeze used — streak saved!"}
    else S.streak=1;
    S.lastGoal=t;S.best=Math.max(S.best,S.streak);
    if(S.streak%7===0&&S.freezes<2){S.freezes++;streakMsg="🧊 7-day bonus: +1 streak freeze"}
    R.goalJustHit=true;
  }
  S.bestCombo=Math.max(S.bestCombo,R.maxCombo);
  if(R.mode==="boss")S.boss=t;
  R.res.push({ok,conf,xp,crit,q});
  R.stage="fb";R.last={ok,conf,xp,crit};
  save();
  buzz(ok?20:[30,60,30]);
  render();
  if(tierMsg==="up")setTimeout(()=>{toast(`🚀 Promoted to <b>${TIERS[S.tier][0]}</b> tier!`,2600);confetti()},300);
  else if(tierMsg==="down")setTimeout(()=>toast(`Easing to ${TIERS[S.tier][0]} tier to rebuild momentum 💪`),300);
  if(R.goalJustHit&&!R.goalShown){R.goalShown=true;setTimeout(()=>{toast(`🔥 Daily goal hit! ${S.streak}-day streak`,2600);confetti()},tierMsg?2800:400)}
  if(streakMsg)setTimeout(()=>toast(streakMsg,2600),5600);
  const fbEl=document.getElementById("fb");if(fbEl)setTimeout(()=>fbEl.scrollIntoView({behavior:"smooth",block:"nearest"}),60);
}
function next(){
  R.i++;
  if(R.i<R.set.length){prepQ();render();window.scrollTo(0,0);return}
  R.stage="done";render();window.scrollTo(0,0);
  const sc=R.res.filter(r=>r.ok).length;if(sc===R.res.length&&R.res.length>=3)confetti();
}

/* ---------- AI endless ---------- */
let sampleFn=null,aiNext=null,aiBusy=false,capsDone=false;
async function genAI(){
  const d=weakest(),t=Math.min(4,Math.max(2,S.tier));
  const prompt=`Write ONE original CISSP practice question (not copied from any published question bank).
Domain: ${d} — ${DOMS[d][0]} (current ISC2 CISSP exam outline).
Difficulty tier: ${TIERS[t][0]} — ${t===2?"apply a concept to a short scenario":t===3?"manager mindset: BEST/FIRST/MOST question where several options are plausible":"exam-hard: subtle distinctions, scenario-based, plausible distractors"}.
Avoid these already-covered topics: ${shuffle(Q.filter(q=>q.d===d)).slice(0,6).map(q=>q.s.slice(0,50)).join(" | ")}.
Rules: four options, exactly one defensibly correct; distractors plausible; options similar length; no "all of the above". Rationale: 2 short sentences explaining why correct and why the most tempting distractor is wrong. Be factually precise.
Return ONLY JSON: {"stem":"...","correct":"...","wrong":["...","...","..."],"why":"..."}`;
  const j=await sampleFn.json(prompt,{modelTier:"default",cache:false});
  if(!j||!j.stem||!j.correct||!Array.isArray(j.wrong)||j.wrong.length<3)throw new Error("bad");
  const id="ai"+Date.now().toString(36);
  return {id,d,t,s:String(j.stem),o:[String(j.correct)].concat(j.wrong.slice(0,3).map(String)),w:String(j.why||""),ai:true};
}
async function startAI(){
  if(!sampleFn||aiBusy)return;
  R={mode:"ai",set:[],i:0,res:[],xp:0,combo:0,maxCombo:0,stage:"load",startTier:S.tier};render();
  try{aiBusy=true;const q=aiNext||await genAI();aiNext=null;aiBusy=false;R.set=[q];R.q=q;R.order=shuffle([0,1,2,3]);R.sel=null;R.stage="q";render();prefetchAI()}
  catch(e){aiBusy=false;R=null;render();toast(e&&e.code==="rate_limited"?"Claude is busy — try again in a minute":"Couldn’t generate a question right now")}
}
async function prefetchAI(){if(aiNext||aiBusy||!sampleFn)return;try{aiBusy=true;aiNext=await genAI()}catch(e){}aiBusy=false}
function aiMore(){
  // keep missed AI questions for review
  R.res.forEach(r=>{if(r.q.ai&&!r.ok){S.ai[r.q.id]=r.q;const ks=Object.keys(S.ai);if(ks.length>60)delete S.ai[ks[0]]}});save();
  if(aiNext){const q=aiNext;aiNext=null;R.set.push(q);R.i++;R.q=q;R.order=shuffle([0,1,2,3]);R.sel=null;R.stage="q";render();window.scrollTo(0,0);prefetchAI()}
  else{R.stage="load";render();(async()=>{try{aiBusy=true;const q=await genAI();aiBusy=false;R.set.push(q);R.i++;R.q=q;R.order=shuffle([0,1,2,3]);R.sel=null;R.stage="q";render();prefetchAI()}catch(e){aiBusy=false;R.stage="done";render()}})()}
}

  if(!S.onboard)h=renderOnboard();
  else if(R&&R.stage==="done")h=renderDone();
  else if(R)h=renderQuiz();
  else h=renderHome();
  if(showSettings)h+=renderSettings();
  app.innerHTML=h;
  const ed=document.getElementById("examdate");if(ed)ed.addEventListener("change",e=>{S.exam=e.target.value;save()});
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el){return}
  if(el.dataset.act==="closeset"&&e.target.closest("[data-stop]")&&!e.target.closest(".iconbtn"))return;
  const a=el.dataset.act;
  switch(a){
    case"level":S.tier=+el.dataset.t;S.onboard=true;save();start("one");toast("First question. Takes 30 seconds 👇");break;
    case"go":{const m=el.dataset.m,arg=el.dataset.a?+el.dataset.a:undefined;R=null;start(m,arg);break}
    case"one":R=null;start("one");break;
    case"pick":R.sel=+el.dataset.o;buzz(8);render();if(!S.conf){}setTimeout(()=>{const c=document.querySelector(".conf");c&&c.scrollIntoView({behavior:"smooth",block:"nearest"})},30);break;
    case"ans":answer(el.dataset.c);break;
    case"next":next();break;
    case"quit":case"home":if(R&&R.mode==="ai")aiMore&&R.res.forEach(r=>{if(r.q.ai&&!r.ok)S.ai[r.q.id]=r.q});save();R=null;render();window.scrollTo(0,0);break;
    case"ai":if(sampleFn)startAI();else toast(capsDone?"Endless mode works when this page is opened in the Claude app":"Still loading. Try again in a second");break;
    case"aimore":aiMore();break;
    case"aidone":R.res.forEach(r=>{if(r.q.ai&&!r.ok)S.ai[r.q.id]=r.q});save();R.stage="done";render();break;
    case"settings":showSettings=true;render();break;
    case"closeset":showSettings=false;confirmReset=false;render();break;
    case"goal":S.goal=+el.dataset.g;save();render();break;
    case"conf":S.conf=el.dataset.v==="1";save();render();break;
    case"settier":S.tier=+el.dataset.t;S.th=[];save();render();break;
    case"reset":if(!confirmReset){confirmReset=true;el.textContent="Tap again to confirm";el.style.color="var(--bad)";}else{S=blank();S.onboard=false;confirmReset=false;showSettings=false;save();R=null;render()}break;
  }
});

/* ---------- confetti ---------- */
function confetti(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#ffb020","#ff7a1a","#2fc57a","#5b9dff","#c48bff","#ff6b8a"];
  const P=Array.from({length:90},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*10,vy:-Math.random()*11-3,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*6)],a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<90)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}

render();

/* ---------- capabilities: sync + AI ---------- */
(async()=>{
  try{
    if(!window.claude||!window.claude.use){capsDone=true;if(!R)render();return}
    const [db,user,sample]=await Promise.all([claude.use("db").catch(()=>null),claude.use("user").catch(()=>null),claude.use("sample").catch(()=>null)]);
    capsDone=true;if(!sample&&!R)render();
    if(sample){sampleFn=sample;if(!R)render()}
    if(db&&user){
      const id=await user.id();if(!id)return;
      const ref=db.doc("data/users/"+id+"/state");
      const got=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
      let remote=null;
      if(got){const v=typeof got.data==="function"?got.data():(got.data!==undefined?got.data:got);if(v&&v.json)remote=v}
      dbRef=ref;
      if(remote&&remote.updated>S.updated){try{S=Object.assign(blank(),JSON.parse(remote.json));localStorage.setItem(KEY,remote.json)}catch(e){} syncState="☁︎ Synced";if(!R)render()}
      else if(S.onboard){save()}
      else syncState="☁︎ Sync on";
      const el=document.getElementById("sync");if(el)el.textContent=syncState;
    }
  }catch(e){}
})();
})();
</script>
